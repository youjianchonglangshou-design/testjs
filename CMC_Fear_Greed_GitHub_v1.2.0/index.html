:root{font-family:Inter,'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#222a3b;background:#fff}*{box-sizing:border-box}body{margin:0}.page{max-width:1530px;margin:auto;padding:22px 16px 38px}h1{font-size:23px;margin:0 0 13px;font-weight:750;letter-spacing:.2px}.desc{color:#8996ac;font-size:13px;margin:0 0 18px}.layout{display:grid;grid-template-columns:352px minmax(0,1fr);gap:12px}.left{display:flex;flex-direction:column;gap:12px}.panel{background:#fff;border-radius:11px;box-shadow:0 3px 25px rgba(25,39,65,.075);border:1px solid #f0f2f7;padding:20px}.panel h2{font-size:16px;font-weight:680;margin:0 0 15px}.gauge{height:108px;position:relative;max-width:255px;margin:0 auto}.gauge svg{width:100%;height:100%;overflow:visible}.gauge-num{position:absolute;left:0;right:0;top:37px;text-align:center;font-size:34px;line-height:1;font-weight:740;color:#161d2b}.gauge-label{position:absolute;left:0;right:0;top:75px;text-align:center;color:#7f8ba2;font-size:12px}.stat-panel{min-height:166px}.stat-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:#8290a9;font-size:12px}.pill{padding:6px 12px;border-radius:30px;font-size:12px;font-weight:650;white-space:nowrap}.pill.yellow{background:#fff6dc;color:#8b99b1}.pill.green{background:#e5f7b8;color:#697b9a}.pill.red{background:#ffedf0;color:#e54352}.pill.strong-green{background:#16c784;color:#fff}.pill.strong-red{background:#ea3943;color:#fff}.year{min-height:136px}.chart-panel{min-height:510px;position:relative;padding:20px 20px 12px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.chart-head h2{margin:0}.range{background:#f3f5f9;color:#202938;font-size:12px;border-radius:7px;padding:9px 13px;border:1px solid #e5e9f0;font-weight:650}.legend{display:flex;align-items:center;flex-wrap:wrap;gap:15px;margin:16px 0 4px;font-size:12px;color:#7d8aa0}.legend span{display:flex;align-items:center;gap:7px}.dot{height:8px;width:8px;display:inline-block;border-radius:50%;background:#ffca16}.dot.price{background:#8e9bb1}.dot.vol{background:#c9cedc}.chart-wrap{height:405px;position:relative}canvas{width:100%;height:100%;display:block;cursor:crosshair}.tip{position:absolute;display:none;z-index:2;pointer-events:none;padding:11px 13px;border-radius:9px;background:rgba(30,41,59,.95);box-shadow:0 8px 28px #14203333;color:#fff;font-size:12px;line-height:1.8;white-space:nowrap}.tip b{font-size:13px}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#9aa7b8;font-size:11px;padding:11px 3px}.foot button{border:0;background:transparent;color:#486dd6;cursor:pointer;font-size:12px}.status{margin-top:15px;color:#9da8b8;font-size:12px}.status.error{color:#d53b48}.note{font-size:11px;color:#9aa7b8;margin:4px 0}.source{color:#7186b6;text-decoration:none}@media(max-width:930px){.layout{grid-template-columns:1fr}.left{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.chart-panel{min-height:475px}.chart-wrap{height:360px}}@media(max-width:640px){.page{padding:17px 10px}.left{display:flex}.chart-panel{padding:14px 8px}.chart-wrap{height:310px}.legend{gap:8px;font-size:10px}h1{font-size:20px}.desc{line-height:1.7}}
</style></head><body><main class="page"><h1>CMC 加密貨幣恐懼與貪婪指數</h1><p class="desc">了解我們的恐懼與貪婪指數，這個工具十分強大，可以分析市場情緒，幫助你做出明智的加密貨幣投資決策。透過即時與歷史資料，掌握市場趨勢。</p><section class="layout"><aside class="left"><article class="panel"><h2>CMC 加密貨幣恐懼與貪婪指數</h2><div class="gauge"><svg viewBox="0 0 260 120"><path d="M 65 100 A 65 65 0 0 1 84.9 53.5" fill="none" stroke="#ea3943" stroke-width="7" stroke-linecap="round"/><path d="M 88 50 A 65 65 0 0 1 109.2 37.5" fill="none" stroke="#f29305" stroke-width="7" stroke-linecap="round"/><path d="M 113.5 36 A 65 65 0 0 1 126 35" fill="none" stroke="#ffcc00" stroke-width="7" stroke-linecap="round"/><path d="M 136 35 A 65 65 0 0 1 164.5 44.5" fill="none" stroke="#b3d900" stroke-width="7" stroke-linecap="round"/><path d="M 169 48 A 65 65 0 0 1 195 100" fill="none" stroke="#16c784" stroke-width="7" stroke-linecap="round"/><circle id="needle" cx="130" cy="35" r="7.5" fill="#070b12" stroke="white" stroke-width="3"/></svg><div id="current" class="gauge-num">--</div><div id="currentClass" class="gauge-label">載入中</div></div></article><article class="panel stat-panel"><h2>歷史數值</h2><div class="stat-row">昨天 <span id="yesterday" class="pill yellow">--</span></div><div class="stat-row">上週 <span id="week" class="pill yellow">--</span></div><div class="stat-row">上個月 <span id="month" class="pill yellow">--</span></div></article><article class="panel year"><h2>年度高點與低點</h2><div class="stat-row">年度高點 <span id="high" class="pill strong-green">--</span></div><div class="stat-row">年度低點 <span id="low" class="pill strong-red">--</span></div></article></aside><article class="panel chart-panel"><div class="chart-head"><h2>恐懼與貪婪指數線圖</h2><span class="range">1年</span></div><div class="legend"><span><i class="dot"></i> CMC 加密貨幣恐懼與貪婪指數</span><span><i class="dot price"></i> 比特幣價格</span><span><i class="dot vol"></i> 比特幣交易量</span></div><div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas><div class="tip" id="tip"></div></div><div class="foot"><span id="dateRange">--</span><button id="refresh">↻ 重新讀取 API</button></div><div class="note">情緒：CMC 官方免費 API（透過專屬 Cloudflare Worker）｜BTC：CryptoCompare｜無排程、無 R2</div><div class="status" id="status">正在連接 CMC API…</div></article></section></main><script>
'use strict';
// Browser fetches the original CMC API through a CORS-enabling public proxy. No YAML or backend.
let fg=[],btc=[],latest=null,hover=-1;const $=id=>document.getElementById(id);const classes=['極度恐懼','恐懼','中性','貪婪','極度貪婪'];function kind(v){return v<20?0:v<40?1:v<60?2:v<80?3:4}const colors=['#ea3943','#f29b09','#faca15','#9cdb00','#16c784'];function textClass(v){return classes[kind(v)]}function day(ts){let d=new Date(ts);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}function closest(arr,t){return arr.reduce((a,b)=>Math.abs(b.t-t)<Math.abs(a.t-t)?b:a,arr[0])}function pill(id,x){if(!x)return;let el=$(id);el.textContent=textClass(x.value)+' - '+x.value;el.style.background=kind(x.value)===0?'#ffecef':kind(x.value)===4?'#e6f7c8':'#fff5d8';el.style.color='#7b8ba5'}function setStatus(message,error=false){$('status').textContent=message;$('status').className='status'+(error?' error':'')}function gauge(v){$('current').textContent=v;$('currentClass').textContent=textClass(v);let a=(Math.PI*(1-v/100)),cx=130+65*Math.cos(a),cy=100-65*Math.sin(a);$('needle').setAttribute('cx',cx);$('needle').setAttribute('cy',cy)}
// SETUP: Paste the URL of the NEW Cloudflare Worker here (once).
const WORKER_BASE = 'https://YOUR-NEW-WORKER.YOUR-SUBDOMAIN.workers.dev';
async function requestJSON(url,timeoutMs=16000){const ac=new AbortController();let tid=setTimeout(()=>ac.abort(),timeoutMs);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok){let msg='';try{msg=(await r.json()).error||''}catch{}throw Error('HTTP '+r.status+(msg?'：'+msg:''))}return await r.json()}finally{clearTimeout(tid)}}
async function requestCMC(path){if(WORKER_BASE.includes('YOUR-NEW-WORKER'))throw Error('請先在 index.html 設定 WORKER_BASE 為你的 Cloudflare Worker 網址');let p=path.startsWith('historical')?'historical':'latest';const data=await requestJSON(WORKER_BASE.replace(/\/$/,'')+'/api/'+p);if(p==='historical'&&!Array.isArray(data?.data))throw Error('CMC 歷史資料缺失');if(p==='latest'&&!data?.data)throw Error('CMC 最新資料缺失');return {data,source:'Cloudflare Worker'}}
function parseTime(v){if(typeof v==='number'||/^\d+$/.test(String(v))){const n=Number(v);return n<1e12?n*1000:n}return Date.parse(v)}function parseFG(raw){return raw.map(p=>({t:parseTime(p.timestamp),value:Number(p.value)})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.value)&&p.value>=0&&p.value<=100).sort((a,b)=>a.t-b.t)}
async function requestBTC(){const j=await requestJSON(WORKER_BASE.replace(/\/$/,'')+'/api/btc');if(!Array.isArray(j?.Data?.Data))throw Error('BTC 無資料');return j.Data.Data.map(d=>({t:d.time*1000,close:Number(d.close),volume:Number(d.volumeto)})).filter(d=>d.t&&d.close>0)}
async function load(){setStatus('正在讀取 CMC 官方最新值與一年歷史…');
 $('refresh').disabled=true;
 try{
  const historical=await requestCMC('historical?limit=370');
  fg=parseFG(historical.data.data).slice(-366);
  if(fg.length<2)throw Error('CMC 官方歷史數據不足');
  let latestSource=historical.source;
  try{const current=await requestCMC('latest');latest=current.data.data;latestSource=current.source;}catch(e){latest=null;}
  const recent=fg[fg.length-1],live=Number(latest?.value);
  gauge(Number.isFinite(live)?live:recent.value);
  const past=fg.filter(x=>x.t<recent.t);
  pill('yesterday',closest(past.length?past:fg,recent.t-86400000));
  pill('week',closest(fg,recent.t-7*86400000));
  pill('month',closest(fg,recent.t-30*86400000));
  const hi=fg.reduce((a,b)=>b.value>a.value?b:a),lo=fg.reduce((a,b)=>b.value<a.value?b:a);
  $('high').textContent=`${day(hi.t)} ・ ${textClass(hi.value)} - ${hi.value}`;
  $('low').textContent=`${day(lo.t)} ・ ${textClass(lo.value)} - ${lo.value}`;
  $('dateRange').textContent=day(fg[0].t)+' ～ '+day(recent.t);
  btc=[];
  try{btc=await requestBTC();}catch(e){console.warn('BTC 附加行情不可用',e)}
  render();setStatus('CMC 官方資料：'+fg.length+' 筆｜歷史通道：'+historical.source+'｜最新通道：'+latestSource+(btc.length?'｜BTC 已載入':'｜BTC 價格與交易量暫不可用')+'｜讀取時間：'+new Date().toLocaleString('zh-TW'));
 }catch(e){fg=[];btc=[];latest=null;render();setStatus(e.message+'。這通常是Worker 或 CMC 拒絕存取，請稍後重試；沒有使用替代指數或假數據。',true)}
 finally{$('refresh').disabled=false}
}
const cvs=$('chart'),tip=$('tip');let rect={};function render(){const wrap=$('chartWrap'),w=wrap.clientWidth,h=wrap.clientHeight,dpr=window.devicePixelRatio||1;cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);let g=cvs.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);let L=38,R=42,T=16,B=35,plotH=h-T-B,plotW=w-L-R;rect={w,h,L,R,T,B,plotH,plotW};if(!fg.length){g.fillStyle='#a3afbe';g.font='13px sans-serif';g.textAlign='center';g.fillText('無法讀取 CMC 官方 API，請查看下方錯誤訊息',w/2,h/2);return}let x=i=>L+i/(fg.length-1)*plotW,y=v=>T+(100-v)/100*plotH;g.fillStyle='#e8f9f2';g.fillRect(L,y(100),plotW,y(80)-y(100));g.fillStyle='#fcecee';g.fillRect(L,y(20),plotW,y(0)-y(20));g.strokeStyle='#d7dce5';g.setLineDash([2,3]);g.lineWidth=.8;g.font='11px sans-serif';g.textAlign='left';g.fillStyle='#60718f';[0,20,40,60,80,100].forEach(v=>{g.beginPath();g.moveTo(L,y(v));g.lineTo(w-R,y(v));g.stroke();g.fillText(String(v),w-R+6,y(v)+4)});g.setLineDash([]);let labels=[[90,'極度貪婪'],[70,'貪婪'],[50,'中性'],[30,'恐懼'],[10,'極度恐懼']];g.textAlign='right';g.font='11px sans-serif';for(let [v,s] of labels){g.fillStyle='#728097';g.fillText(s,w-R-8,y(v)-8)};let dates=fg.map(x=>x.t);g.textAlign='center';g.fillStyle='#72819a';for(let i=0;i<6;i++){let idx=Math.round(i*(fg.length-1)/5);let d=new Date(dates[idx]);g.fillText(d.toLocaleString('en-US',{month:'short',year:'numeric',timeZone:'UTC'}),x(idx),h-12)};let bars=btc.length?fg.map(a=>{let b=btc.find(z=>day(z.t)===day(a.t));return b||null}):[];let maxvol=Math.max(1,...bars.map(a=>a?.volume||0));bars.forEach((a,i)=>{if(a){g.fillStyle='rgba(162,159,199,.32)';let bh=(a.volume/maxvol)*plotH*.20;g.fillRect(x(i)-Math.max(1,plotW/fg.length)*.5,T+plotH-bh,Math.max(1,plotW/fg.length),bh)}});if(btc.length){let btcMap=new Map(btc.map(a=>[day(a.t),a]));let p=fg.map(a=>btcMap.get(day(a.t))?.close||null),good=p.filter(Number.isFinite);if(good.length){let min=Math.min(...good),max=Math.max(...good),pad=(max-min)*.08||1;min-=pad;max+=pad;g.beginPath();let start=true;p.forEach((v,i)=>{if(v===null){start=true;return}let py=T+(max-v)/(max-min)*plotH;if(start){g.moveTo(x(i),py);start=false}else g.lineTo(x(i),py)});g.strokeStyle='#99a8c0';g.lineWidth=2;g.stroke();g.textAlign='right';g.fillStyle='#7f8da5';g.font='11px sans-serif';for(let i=0;i<=4;i++){let val=max-i*(max-min)/4;g.fillText('$'+Math.round(val/1000)+'K',L-5,T+i*plotH/4+4)}}}for(let i=1;i<fg.length;i++){let a=fg[i-1],b=fg[i],xx=x(i-1),xx2=x(i),yy=y(a.value),yy2=y(b.value);g.beginPath();g.moveTo(xx,yy);g.lineTo(xx2,yy2);g.strokeStyle=colors[kind((a.value+b.value)/2)];g.lineWidth=2.1;g.stroke()}if(hover>=0&&hover<fg.length){let i=hover;g.strokeStyle='#6b758b';g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(x(i),T);g.lineTo(x(i),T+plotH);g.stroke();g.setLineDash([]);g.beginPath();g.arc(x(i),y(fg[i].value),4,0,2*Math.PI);g.fillStyle=colors[kind(fg[i].value)];g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}}
cvs.addEventListener('mousemove',e=>{if(!fg.length)return;let b=cvs.getBoundingClientRect();hover=Math.max(0,Math.min(fg.length-1,Math.round((e.clientX-b.left-rect.L)/rect.plotW*(fg.length-1))));let v=fg[hover],bitem=btc.find(z=>day(z.t)===day(v.t));tip.innerHTML='<b>'+day(v.t)+'</b><div>恐懼與貪婪：'+v.value+'（'+textClass(v.value)+'）</div>'+(bitem?'<div>BTC 價格：$'+bitem.close.toLocaleString('en-US')+'</div><div>BTC 成交額：$'+Math.round(bitem.volume).toLocaleString('en-US')+'</div>':'');tip.style.display='block';let maxX=b.width-tip.offsetWidth-10;tip.style.left=Math.max(0,Math.min(e.clientX-b.left+14,maxX))+'px';tip.style.top=Math.max(0,e.clientY-b.top-tip.offsetHeight-10)+'px';render()});cvs.addEventListener('mouseleave',()=>{hover=-1;tip.style.display='none';render()});window.addEventListener('resize',render);$('refresh').addEventListener('click',load);load();
</script></body></html>
